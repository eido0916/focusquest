<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10162f" />
    <title>FocusQuest</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <p class="eyebrow">DAILY ADVENTURE</p>
        <h1>FocusQuest</h1>
        <p class="subtitle">集中した時間を、今日の冒険に変えよう。</p>
      </header>

      <section class="quest-card" aria-labelledby="quest-title">
        <div class="quest-heading">
          <div>
            <p class="label">CURRENT QUEST</p>
            <h2 id="quest-title">25分の集中クエスト</h2>
          </div>
          <span class="level">LV. 1</span>
        </div>

        <div class="timer" id="timer" aria-live="polite">25:00</div>

        <div class="progress-track" aria-hidden="true">
          <div class="progress-bar" id="progress-bar"></div>
        </div>

        <div class="controls">
          <button class="primary-button" id="toggle-button" type="button">
            クエスト開始
          </button>
          <button class="secondary-button" id="reset-button" type="button">
            リセット
          </button>
        </div>
      </section>

      <section class="status-grid" aria-label="今日の記録">
        <article class="status-card">
          <span>今日のクリア</span>
          <strong><span id="completed-count">0</span> 回</strong>
        </article>
        <article class="status-card">
          <span>獲得XP</span>
          <strong><span id="xp-count">0</span> XP</strong>
        </article>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
